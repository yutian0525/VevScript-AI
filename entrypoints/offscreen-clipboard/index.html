     async Clipboard API 的 writeText 要求文档焦点——offscreen 永不可见即永无焦点，
     故本页用 execCommand('copy') + 临时 textarea 路径（详见 main.ts 头注）。
     SW 经 runtime.sendMessage({ type: 'OFFSCREEN_WRITE_CLIPBOARD', text }) 委托本页写入。 -->

    <meta charset="UTF-8" />
